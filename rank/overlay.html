        /** valo/map/{name}.png — fichier local “havent” pour Haven */
        normalizeMapFileName(name) {
            if (!name || typeof name !== 'string') return 'ascent';
            let s = name.toLowerCase().replace(/\s+/g, '');
            const aliases = { haven: 'havent' };
            return aliases[s] || s;
        }

        /** valo/agent/{name}.png (minuscules, sans caractères spéciaux) */
        normalizeAgentFileName(name) {
            if (!name || typeof name !== 'string') return 'jett';
            const s = name.toLowerCase().replace(/[^a-z0-9]/g, '');
            return s || 'jett';
        }

        applyMatchHistoryToCards(entries) {
            const track = document.getElementById('fuguHistoryTrackValo');
            if (!track) return;
            const cards = Array.from(track.querySelectorAll('.game-card'));
            entries.forEach((entry, i) => {
                if (i >= cards.length) return;
                const card = cards[i];
                const mapEl = card.querySelector('.game-card__map');
                const agentEl = card.querySelector('.game-card__agent');
                const mapPath = `valo/map/${entry.mapFile}.png`;
                const agentPath = `valo/agent/${entry.agentFile}.png`;
                if (mapEl) {
                    mapEl.style.backgroundImage = `url('${mapPath}')`;
                }
                if (agentEl) {
                    agentEl.src = agentPath;
                    agentEl.style.opacity = '1';
                    agentEl.onerror = function handleAgentImgErr() {
                        agentEl.onerror = null;
                        agentEl.src = 'valo/images/no-rank.png';
                    };
                }
                card.classList.remove('game-card--placeholder', 'game-card--lol', 'game-card--win', 'game-card--loss');
                card.classList.add(entry.won ? 'game-card--win' : 'game-card--loss');
            });
            window.__overlayFuguMatchCount = entries.length;
            if (typeof window.overlayFuguUpdateHistoryCount === 'function') {
                window.overlayFuguUpdateHistoryCount();
            }
            this._valoLastEntries = entries.map((e) => ({ ...e }));
        }

        async fetchCompetitiveMatchHistory() {
            if (!this.puuid || this.manualMode) {
                return false;
            }
            try {
                const base = `https://api.henrikdev.xyz/valorant/v4/by-puuid/matches/${this.region}/${this.platform}/${encodeURIComponent(
                    this.puuid
                )}`;
                const url = `${base}?queue=competitive&size=15&api_key=${encodeURIComponent(this.apiKey)}`;
                console.log('🎮 Match history v4:', url.replace(this.apiKey, '***'));
                const response = await fetch(url);
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}`);
                }
                const json = await response.json();
                if (this._gameSwitchGeneration !== this._fetchGenSnapshot) {
                    return false;
                }
                const list = json && Array.isArray(json.data) ? json.data : [];
                const pid = this.puuid.toLowerCase();
                const entries = [];

                for (const match of list) {
                    const meta = match.metadata || {};
                    const players = match.players || [];
                    const me = players.find((p) => (p.puuid || '').toLowerCase() === pid);
                    if (!me) continue;

                    const teamId = me.team_id;
                    const team = (match.teams || []).find((t) => t.team_id === teamId);
                    const won = team ? !!team.won : false;
                    const mapName = meta.map && meta.map.name;
                    const agentName = me.agent && me.agent.name;

                    entries.push({
                        won,
                        mapFile: this.normalizeMapFileName(mapName),
                        agentFile: this.normalizeAgentFileName(agentName)
                    });
                    if (entries.length >= 10) break;
                }

                if (entries.length === 0) {
                    console.log('⚠️ Aucun match competitive dans la réponse');
                    this.clearMatchHistoryCards('valo');
                    return true;
                }

                if (this._gameSwitchGeneration !== this._fetchGenSnapshot) {
                    return false;
                }

                this.applyMatchHistoryToCards(entries);
                console.log('✅ Historique competitive:', entries.length, 'parties');
                return true;
            } catch (err) {
                console.error('❌ fetchCompetitiveMatchHistory:', err);
                return false;
            }
        }

        // Méthode pour intégrer l'API Riot Games
        async fetchRealRankData() {
            try {
                if (!this.puuid) {
                    console.warn('[overlay-fugu] Ajoutez ?puuid=VOTRE_PUUID dans l URL du navigateur source (OBS).');
                    return false;
                }
                console.log('🚀 Début de fetchRealRankData...');
                console.log('👤 PUUID:', this.puuid);

                const apiUrl = `https://api.henrikdev.xyz/valorant/v3/by-puuid/mmr/${this.region}/${this.platform}/${this.puuid}?api_key=${this.apiKey}`;
                console.log('🌐 URL API:', apiUrl);

                console.log('📡 Envoi de la requête vers l\'API...');
                const response = await fetch(apiUrl);

                console.log('📋 Statut de la réponse:', response.status, response.statusText);
                console.log('📋 Headers de la réponse:', Object.fromEntries(response.headers.entries()));

                if (!response.ok) {
                    throw new Error(`Erreur HTTP: ${response.status} - ${response.statusText}`);
                }

                console.log('📦 Parsing du JSON...');
                const json = await response.json();
                console.log('📄 Réponse complète de l\'API:', json);

                if (this._gameSwitchGeneration !== this._fetchGenSnapshot) {
                    return false;
                }

                if (!json.data) {
                    console.error('❌ Pas de données dans la réponse:', json);
                    throw new Error('Aucune donnée reçue de l\'API');
                }

                const data = json.data;
                console.log('🎯 Données du joueur:', data);

                // Update player name and tag from API response if available
                if (data.account) {
                    this.playerName = data.account.name;
                    this.playerTag = data.account.tag;
                    console.log(`👤 Nom du joueur mis à jour: ${this.playerName}#${this.playerTag}`);
                }

                // Check if player has no rank (games_needed_for_rating > 0)
                const gamesNeededForRating = data.current.games_needed_for_rating || 0;
                const hasNoRank = gamesNeededForRating > 0;

                console.log(`🎮 Games needed for rating: ${gamesNeededForRating} (Has no rank: ${hasNoRank})`);

                // Store old values for animation and comparison
                const oldRR = this.currentRankData.rr;
                const oldTier = this.currentRankData.tier;
                const newRR = hasNoRank ? 0 : data.current.rr;
                const newTier = hasNoRank ? 0 : data.current.tier.id;
                const changeValue = data.current.last_change;

                // Mettre à jour les données internes (API v3 structure)
                this.currentRankData = {
                    rank: hasNoRank ? 'No Rank' : data.current.tier.name,
                    rr: newRR,
                    tier: newTier,
                    hasNoRank: hasNoRank
                };

                console.log('✅ Données de rang mises à jour:', this.currentRankData);

                // Update rank image immediately if tier changed
                if (oldTier !== newTier) {
                    console.log(`🏆 Changement de rang détecté: ${oldTier} → ${newTier}`);
                    this.updateRankImage();
                }

                // Update display with animation if RR changed
                if (oldRR !== newRR) {
                    console.log(`🎬 Animation RR: ${oldRR} → ${newRR} (change: ${changeValue})`);
                    await this.animateRRChange(oldRR, newRR, changeValue);
                } else {
                    // Just update the display without animation
                    this.displayCurrentRank();
                }

                // Always update the rank image to handle no-rank case
                this.updateRankImage();

                // Sauvegarder les nouvelles données
                await this.saveRankData();

                console.log('🎉 fetchRealRankData terminé avec succès!');
                return true;

            } catch (error) {
                console.error('❌ Erreur dans fetchRealRankData:', error);
                console.error('📊 Stack trace:', error.stack);
                this.displayError('Erreur API');
                return false;
            }
        }
}

        function overlayFuguHistorySetup() {
            var HISTORY_MIN = 3;
            var HISTORY_MAX = 10;
            window.__overlayFuguMatchCount = HISTORY_MAX;
            var TRACK_IDS = ['fuguHistoryTrackValo', 'fuguHistoryTrackLol'];
            function updateHistoryVisibleCount() {
                var dataCap =
                    typeof window.__overlayFuguMatchCount === 'number' ? window.__overlayFuguMatchCount : HISTORY_MAX;
                if (dataCap < 1) dataCap = HISTORY_MAX;
                TRACK_IDS.forEach(function (id) {
                    var track = document.getElementById(id);
                    if (!track) return;
                    var cards = track.querySelectorAll('.game-card');
                    if (!cards.length) return;
                    var style = getComputedStyle(track);
                    var gap = parseFloat(style.gap) || 12;
                    var w = track.clientWidth;
                    var cw = cards[0].offsetWidth;
                    if (cw <= 0 || w <= 0) return;
                    var n = Math.floor((w + gap) / (cw + gap));
                    n = Math.max(HISTORY_MIN, Math.min(HISTORY_MAX, dataCap, n));
                    cards.forEach(function (el, i) {
                        el.hidden = i >= n;
                    });
                    track.dataset.visibleGames = String(n);
                });
            }
            var inner = document.querySelector('.fugu-inner');
            var stack = document.querySelector('.fugu-history-stack');
            if (typeof ResizeObserver !== 'undefined') {
                var ro = new ResizeObserver(updateHistoryVisibleCount);
                if (inner) ro.observe(inner);
                if (stack) ro.observe(stack);
                TRACK_IDS.forEach(function (tid) {
                    var t = document.getElementById(tid);
                    if (t) ro.observe(t);
                });
            } else {
                window.addEventListener('resize', updateHistoryVisibleCount);
            }
            window.addEventListener('load', updateHistoryVisibleCount);
            requestAnimationFrame(function () {
                requestAnimationFrame(updateHistoryVisibleCount);
            });
            window.overlayFuguUpdateHistoryCount = updateHistoryVisibleCount;
        }

        var rankSwitchAnim = null;
        var rrTickAnim = null;
        function overlayFuguUseWaapi(el) {
            return el && typeof el.animate === 'function';
        }
        window.testRankIconSwitch = function () {
            var wrap = document.querySelector('.fugu-rank__icon-wrap');
            if (!wrap) return console.warn('[overlay-fugu] .fugu-rank__icon-wrap introuvable');
            if (rankSwitchAnim) {
                try { rankSwitchAnim.cancel(); } catch (e) {}
                rankSwitchAnim = null;
            }
            if (overlayFuguUseWaapi(wrap)) {
                rankSwitchAnim = wrap.animate(
                    [
                        { opacity: 0.45, transform: 'scale(0.78) rotate(-4deg)' },
                        { opacity: 1, transform: 'scale(1.06) rotate(1deg)', offset: 0.55 },
                        { opacity: 1, transform: 'scale(1) rotate(0deg)' }
                    ],
                    { duration: 650, easing: 'cubic-bezier(0.22, 1, 0.36, 1)' }
                );
                rankSwitchAnim.onfinish = function () { rankSwitchAnim = null; };
                return;
            }
            wrap.classList.remove('is-switching');
            requestAnimationFrame(function () {
                requestAnimationFrame(function () { wrap.classList.add('is-switching'); });
            });
        };
        window.testRRTick = function (dir, nextRR) {
            var el = document.getElementById('rrDisplay');
            if (!el) return console.warn('[overlay-fugu] #rrDisplay introuvable');
            if (typeof nextRR === 'number') el.textContent = nextRR + ' RR';
            if (rrTickAnim) {
                try { rrTickAnim.cancel(); } catch (e) {}
                rrTickAnim = null;
            }
            var up = dir !== 'down';
            if (overlayFuguUseWaapi(el)) {
                rrTickAnim = el.animate(
                    up
                        ? [
                              { transform: 'translateY(0) scale(1)', color: '#fff' },
                              { transform: 'translateY(-12px) scale(1.15)', color: '#5cff7a', offset: 0.4 },
                              { transform: 'translateY(0) scale(1)', color: '#fff' }
                          ]
                        : [
                              { transform: 'translateY(0) scale(1)', color: '#fff' },
                              { transform: 'translateY(12px) scale(1.15)', color: '#ff6b6b', offset: 0.4 },
                              { transform: 'translateY(0) scale(1)', color: '#fff' }
                          ],
                    { duration: 550, easing: 'cubic-bezier(0.22, 1, 0.36, 1)' }
                );
                rrTickAnim.onfinish = function () { rrTickAnim = null; };
                return;
            }
            var cls = up ? 'is-tick-up' : 'is-tick-down';
            el.classList.remove('is-tick-up', 'is-tick-down');
            requestAnimationFrame(function () {
                requestAnimationFrame(function () { el.classList.add(cls); });
            });
        };
        window.testRankSwap = function (src, name) {
            src = src || 'valo/images/Immortal_2_Rank.png';
            name = name != null ? name : 'Immortal 2';
            var img = document.querySelector('.fugu-rank__icon--valo');

            if (nameEl) nameEl.textContent = name;
            function play() { window.testRankIconSwitch(); }
            if (img.complete) play();
            else img.addEventListener('load', play, { once: true });
        };
